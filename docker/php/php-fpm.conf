[www]
; php-fpm pool for the Laravel starter. Listens on TCP loopback —
; only nginx in this same container can reach it. (A Unix socket
; under /run would need a writable directory for the www-data user;
; loopback TCP avoids that permission trap entirely.)
listen = 127.0.0.1:9000

user = www-data
group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Send PHP errors to stderr so Railway's log stream captures them.
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
; Never let a pool-level setting re-enable error display.
php_admin_flag[display_errors] = off

; Clear env vars by default; Laravel reads them from the container
; environment, not from php-fpm's inherited env.
clear_env = no
