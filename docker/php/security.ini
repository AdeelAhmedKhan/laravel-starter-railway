# PHP security hardening for the Laravel starter.
# Loaded after the base php.ini (99- prefix), so these override defaults.
#
# --- CVE-2026-115560 (residual php2shell RCE, 23 Oct 2026) ---------
# The 8.5.12 bugfix release fixes CVE-2026-109618 / CVE-2026-109619,
# but a residual RCE via session.upload_progress was disclosed after
# 8.5.12 shipped and is only fixed in the NEXT bugfix release.
# php.net's interim mitigation: disable session.upload_progress.
# This starter does not use upload-progress tracking at all, so
# turning it off costs nothing.
session.upload_progress.enabled = 0

# --- Information disclosure ---------------------------------------
# Never leak the PHP version in response headers.
expose_php = 0

# --- Session hardening --------------------------------------------
# Sessions are the login mechanism for the web guard; Sanctum tokens
# are used for the API. Keep session cookies strict even though the
# API is token-based — defence in depth.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
# Short session id entropy is handled by PHP defaults (32 bytes);
# keep the garbage-collection probability sane for containers.
session.gc_probability = 1
session.gc_divisor = 100

# --- Upload limits (small on purpose for a starter) ----------------
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5

# --- Execution limits ---------------------------------------------
max_execution_time = 30
memory_limit = 256M

# --- Error handling ------------------------------------------------
# Production must never leak stack traces or paths. Laravel's
# APP_DEBUG=false is the primary control; this is the backstop so a
# misconfigured APP_DEBUG cannot dump errors to the browser.
display_errors = 0
display_startup_errors = 0
log_errors = 1
error_log = /dev/stderr
