opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.revalidate_freq=60
; In production the code does not change between deploys, so validate
; timestamps only once a minute; a redeploy restarts php-fpm anyway.
opcache.validate_timestamps=1
opcache.save_comments=1
; JIT is off: this starter is I/O-bound (DB + HTTP), and JIT adds
; attack surface for no measurable gain here.
opcache.jit=off
