# nginx for the Laravel starter (php-fpm, no mod_php).
# This is a TEMPLATE: entrypoint.sh substitutes ${PORT} (Railway
# injects $PORT at runtime; defaults to 8080 locally) and writes the
# real config to /etc/nginx/nginx.conf.
#
# Security notes:
# - Only /public is served. The ONLY PHP entry point is index.php;
#   no other .php file is ever executed, and requests for any other
#   .php path return 404. This is the nginx-side half of the
#   php2shell defence (see README "Security story").
# - Hidden files (.env, .git, storage/, etc.) are never served.
# - Security headers are ALSO set by Laravel's SecurityHeaders
#   middleware (app/Http/Middleware/SecurityHeaders.php) — nginx
#   sets them here as a backstop for responses that never reach
#   Laravel (e.g. static 404s). Duplicates are avoided: nginx sets
#   them `always` only when Laravel has not already set them is not
#   possible at this layer, so the middleware is the source of truth
#   for app responses and nginx covers the static/error cases.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;
    server_tokens off;

    # HSTS is set by the Laravel middleware for app responses; set it
    # here too so even nginx-level errors carry it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    server {
        listen ${PORT};
        server_name _;
        root /app/public;
        index index.php;

        # Never serve hidden files or anything outside public/.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # The ONLY PHP entry point. Any other .php request is a 404.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTPS $https if_not_empty;
            # Trust Railway's proxy headers for scheme/host only via
            # Laravel's TrustProxies middleware, not here.
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }

        location ~ \.php$ {
            return 404;
        }

        # Static assets: cache aggressively, they are fingerprinted.
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
